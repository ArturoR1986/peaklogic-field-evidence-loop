name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: peaklogic-evidence doctor
      - run: pytest
      - run: python scripts/run_failure_matrix.py

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t peaklogic-field-evidence-loop:ci .
      - run: docker run --rm peaklogic-field-evidence-loop:ci python -m peaklogic_field_evidence.service --check
