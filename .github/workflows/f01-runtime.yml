name: f01-runtime
on:
  push:
    branches: [work/f01-f02-field-readiness]
    paths: [.github/workflows/f01-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain pinned wheels for isolated local execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python --version > wheelhouse/python.txt
          python -m pip download --only-binary=:all: --dest wheelhouse \
            opencv-contrib-python-headless==5.0.0.93 numpy==2.3.2 \
            pytest==8.4.1 onnx==1.23.0 pytesseract==0.3.13 setuptools wheel
          cd wheelhouse
          sha256sum *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f01-pinned-linux-py313-wheelhouse
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
